[package]
name = "ax-crew"
version = "0.3.8"
edition = "2024"
rust-version = "1.92"
description = "AX Crew control plane: REST/WebSocket gateway, DAG scheduling and device routing for AX runtimes"
license = "MIT"

# `src/lib.rs` exposes the module tree (`ax_crew`) and `src/main.rs` is the thin
# bootstrap binary that keeps the published artifact name `ax-crew.exe`.
[lib]
name = "ax_crew"
path = "src/lib.rs"

[[bin]]
name = "ax-crew"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
base64 = "0.22"
ed25519-dalek = "2"
rand = "0.8"
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "system-proxy"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
prost = "0.13"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
jsonwebtoken = { version = "10", features = ["rust_crypto"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Memory"] }
