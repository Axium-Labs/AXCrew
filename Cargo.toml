# AXCrew workspace root.
#
# The root manifest only organises the product: it holds no code of its own.
# The control plane is `crates/server`; the desktop shell is a separate Cargo
# project under `apps/desktop/src-tauri` and is deliberately excluded so it keeps
# its own lockfile, target directory and Tauri toolchain requirements.
[workspace]
resolver = "3"
members = ["crates/server"]
exclude = ["apps/desktop/src-tauri"]
