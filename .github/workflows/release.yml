name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bundles: nsis
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            bundles: deb,appimage
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            bundles: deb
          - target: aarch64-apple-darwin
            os: macos-15
            bundles: app,dmg
          - target: x86_64-apple-darwin
            os: macos-15
            bundles: app,dmg
    env:
      AX_CREW_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build native desktop and backend
        working-directory: apps/desktop
        run: npm run tauri:build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Stage verified installer names
        run: node scripts/stage-platform-assets.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: axcrew-release-${{ matrix.target }}
          path: dist-platform/**
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download assets
        uses: actions/download-artifact@v4
        with:
          pattern: axcrew-release-*
          path: assets
          merge-multiple: true
      - name: Generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd assets
          sha256sum AX-Crew-* > SHA256SUMS
          cat SHA256SUMS
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            assets/AX-Crew-*
            assets/SHA256SUMS
          generate_release_notes: true
