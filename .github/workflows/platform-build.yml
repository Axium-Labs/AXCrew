name: Desktop platform builds

on:
  workflow_dispatch:
  pull_request:
    paths: ["apps/desktop/**", "crates/**", "scripts/**", "Cargo.*", ".github/workflows/platform-build.yml"]

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb
          - os: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: macos-15
            target: x86_64-apple-darwin
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    env:
      AX_CREW_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Backend checks
        run: |
          cargo check --workspace --locked
          cargo clippy --workspace --all-targets --locked
          cargo test --workspace --locked
      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build native desktop and backend
        working-directory: apps/desktop
        run: npm run tauri:build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Stage verified installer names
        run: node scripts/stage-platform-assets.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: AXCrew-${{ matrix.target }}
          path: dist-platform/**
          if-no-files-found: error
