[package]
name = "ax-crew-desktop"
version = "0.3.0"
description = "AX Crew desktop control plane"
authors = ["AX Crew contributors"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "ax_crew_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.5", features = [] }

[dependencies]
base64 = "0.22"
serde_json = "1.0"
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.3.1", features = ["tray-icon"] }
tauri-plugin-log = "2.0.0-rc"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-notification = "2"
uuid = { version = "1", features = ["v4"] }
portable-pty = "0.9"
tauri-plugin-dialog = "2"
# 仅用于「检查 AX 更新」那一次 GitHub Releases 查询；下载与安装交给 AX 自己的
# 升级器和官方安装脚本，所以这里只要 json + rustls。
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "system-proxy"] }
sha2 = "0.10"
